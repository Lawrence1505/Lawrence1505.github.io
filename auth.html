<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign In — GATEmaster</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #06060f;
      --bsoft: rgba(255, 255, 255, 0.07);
      --or: #f97316;
      --am: #f59e0b;
      --tx: #e2e8f0;
      --mt: #94a3b8;
      --err: #f87171;
      --ok: #34d399
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(249, 115, 22, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(249, 115, 22, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none
    }

    .glow {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(249, 115, 22, 0.1), transparent 70%);
      pointer-events: none
    }

    .brand {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      text-decoration: none;
      color: var(--tx);
      margin-bottom: 28px
    }

    .brand span {
      color: var(--or)
    }

    .card {
      background: rgba(14, 14, 32, 0.95);
      border: 1px solid var(--bsoft);
      border-radius: 24px;
      padding: 36px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(20px)
    }

    .tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--bsoft)
    }

    .tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--mt);
      transition: all .2s
    }

    .tab.active {
      background: linear-gradient(135deg, var(--or), var(--am));
      color: #000
    }

    .form {
      display: none;
      flex-direction: column;
      gap: 14px
    }

    .form.active {
      display: flex
    }

    .ftitle {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 2px
    }

    .fsub {
      font-size: 0.83rem;
      color: var(--mt);
      margin-bottom: 4px
    }

    label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mt);
      display: block;
      margin-bottom: 5px
    }

    .iw {
      position: relative
    }

    .iw i.ico {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mt);
      font-size: 0.82rem;
      pointer-events: none
    }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=tel] {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bsoft);
      border-radius: 10px;
      padding: 11px 13px 11px 36px;
      color: var(--tx);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: border-color .2s
    }

    input:focus {
      border-color: var(--or)
    }

    input::placeholder {
      color: rgba(148, 163, 184, 0.45)
    }

    .prow {
      display: flex;
      gap: 8px
    }

    .pcode {
      width: 72px;
      padding-left: 10px;
      text-align: center
    }

    .otp-send {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      color: var(--or);
      padding: 11px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      transition: all .2s
    }

    .otp-send:hover {
      background: rgba(249, 115, 22, 0.2)
    }

    .otp-send:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .otp-boxes {
      display: flex;
      gap: 8px;
      margin-top: 6px
    }

    .otp-boxes input {
      width: 100%;
      text-align: center;
      padding: 11px 4px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px
    }

    .tmr {
      font-size: 0.71rem;
      color: var(--mt);
      margin-top: 3px
    }

    .pwrap {
      position: relative
    }

    .pwrap input {
      padding-right: 38px
    }

    .peye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--mt);
      cursor: pointer;
      font-size: 0.83rem;
      padding: 0
    }

    .btn {
      padding: 13px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--or), var(--am));
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.93rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .3px;
      margin-top: 2px
    }

    .btn:hover {
      opacity: .88;
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(249, 115, 22, .28)
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none
    }

    .div {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--mt);
      font-size: 0.77rem
    }

    .div::before,
    .div::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--bsoft)
    }

    .srow {
      display: flex;
      gap: 10px
    }

    .sbtn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bsoft);
      color: var(--tx);
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all .2s
    }

    .sbtn:hover {
      border-color: rgba(249, 115, 22, .35);
      background: rgba(249, 115, 22, .06)
    }

    .msg {
      font-size: 0.78rem;
      padding: 9px 13px;
      border-radius: 8px;
      display: none;
      line-height: 1.4
    }

    .msg.err {
      background: rgba(248, 113, 113, .1);
      border: 1px solid rgba(248, 113, 113, .25);
      color: var(--err);
      display: block
    }

    .msg.ok {
      background: rgba(52, 211, 153, .1);
      border: 1px solid rgba(52, 211, 153, .25);
      color: var(--ok);
      display: block
    }

    .hint {
      margin-top: 18px;
      font-size: 0.79rem;
      color: var(--mt);
      text-align: center
    }

    .hint a {
      color: var(--or);
      text-decoration: none;
      font-weight: 600
    }

    .back {
      position: fixed;
      top: 20px;
      left: 22px;
      font-size: 0.79rem;
      color: var(--mt);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color .2s;
      z-index: 10
    }

    .back:hover {
      color: var(--or)
    }

    #recaptcha-container {
      margin-top: 8px
    }
  </style>
</head>

<body>
  <div class="glow"></div>
  <a href="gatemaster.html" class="back"><i class="fas fa-arrow-left"></i> GATEmaster</a>
  <a href="gatemaster.html" class="brand">GATE<span>master</span></a>

  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-in" onclick="switchTab('in')">Sign In</div>
      <div class="tab" id="tab-up" onclick="switchTab('up')">Sign Up</div>
    </div>

    <!-- SIGN IN -->
    <form class="form active" id="form-in" onsubmit="doSignIn(event)">
      <div class="ftitle">Welcome back 👋</div>
      <div class="fsub">Sign in to your GATEmaster account</div>
      <div id="msg-in" class="msg"></div>
      <div><label>Email</label>
        <div class="iw"><i class="fas fa-envelope ico"></i><input type="email" id="in-email"
            placeholder="you@example.com" required></div>
      </div>
      <div><label>Password</label>
        <div class="iw pwrap"><i class="fas fa-lock ico"></i><input type="password" id="in-pwd" placeholder="••••••••"
            required><button type="button" class="peye" onclick="togglePwd('in-pwd',this)"><i
              class="fas fa-eye"></i></button></div>
      </div>
      <button type="submit" class="btn" id="in-btn"><i class="fas fa-sign-in-alt" style="margin-right:7px"></i>Sign
        In</button>
      <div class="div">or</div>
      <div class="srow">
        <button type="button" class="sbtn" onclick="doGoogle()"><i class="fab fa-google"></i> Google</button>
      </div>
    </form>

    <!-- SIGN UP -->
    <form class="form" id="form-up" onsubmit="doSignUp(event)">
      <div class="ftitle">Join GATEmaster 🚀</div>
      <div class="fsub">Create your free account</div>
      <div id="msg-up" class="msg"></div>
      <div><label>Full Name</label>
        <div class="iw"><i class="fas fa-user ico"></i><input type="text" id="up-name" placeholder="Lawrence Patel"
            required></div>
      </div>
      <div><label>Email</label>
        <div class="iw"><i class="fas fa-envelope ico"></i><input type="email" id="up-email"
            placeholder="you@example.com" required></div>
      </div>
      <div>
        <label for="up-phone">Phone Number</label>
        <div style="display:flex;gap:8px;align-items:center">
          <span
            style="background:rgba(255,255,255,0.04);border:1px solid var(--bsoft);border-radius:10px;padding:11px 14px;font-size:0.88rem;color:var(--mt);white-space:nowrap">+91</span>
          <input type="tel" id="up-phone" placeholder="9876543210" style="flex:1;padding-left:14px"
            oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" required>
        </div>
        <p style="font-size:0.7rem;color:var(--mt);margin-top:5px;">📱 Phone OTP verification coming soon</p>
      </div>
      <div><label>Password</label>
        <div class="iw pwrap"><i class="fas fa-lock ico"></i><input type="password" id="up-pwd"
            placeholder="Min. 8 characters" required minlength="8"><button type="button" class="peye"
            onclick="togglePwd('up-pwd',this)"><i class="fas fa-eye"></i></button></div>
      </div>
      <button type="submit" class="btn" id="up-btn"><i class="fas fa-user-plus" style="margin-right:7px"></i>Create
        Account</button>
      <div class="div">or sign up with</div>
      <div class="srow"><button type="button" class="sbtn" onclick="doGoogle()"><i class="fab fa-google"></i>
          Google</button></div>
    </form>

    <div class="hint" id="hint">Don't have an account? <a href="#" onclick="switchTab('up');return false">Sign Up</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup, updateProfile, onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const app = initializeApp({
      apiKey: "AIzaSyCQbf0mX9lAWo2t5HmaKgIz1RCHVoyjX78",
      authDomain: "gatemaster-17990.firebaseapp.com",
      projectId: "gatemaster-17990",
      storageBucket: "gatemaster-17990.firebasestorage.app",
      messagingSenderId: "931209173996",
      appId: "1:931209173996:web:f2e3cddad61b6b63fffec9"
    });
    const auth = getAuth(app);
    const gProvider = new GoogleAuthProvider();

    // Redirect if already signed in
    onAuthStateChanged(auth, u => { if (u) window.location.href = 'progress.html'; });

    function msg(id, type, text) {
      const el = document.getElementById(id);
      el.className = 'msg ' + type;
      el.textContent = text;
    }

    function setLoading(btnId, loading) {
      const b = document.getElementById(btnId);
      b.disabled = loading;
      if (loading) b.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:7px"></i>Please wait...';
    }

    window.switchTab = function (t) {
      ['in', 'up'].forEach(x => {
        document.getElementById('form-' + x).classList.toggle('active', x === t);
        document.getElementById('tab-' + x).classList.toggle('active', x === t);
      });
      document.getElementById('hint').innerHTML = t === 'in'
        ? "Don't have an account? <a href='#' onclick='switchTab(\"up\");return false'>Sign Up</a>"
        : "Already have an account? <a href='#' onclick='switchTab(\"in\");return false'>Sign In</a>";
    };

    window.togglePwd = function (id, btn) {
      const inp = document.getElementById(id);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
    };

    window.on = function (el, nextId) { if (el.value && nextId) document.getElementById(nextId).focus(); };
    window.ob = function (e, el, prevId) { if (e.key === 'Backspace' && !el.value && prevId) document.getElementById(prevId).focus(); };

    function getOTP() {
      return ['o1', 'o2', 'o3', 'o4', 'o5', 'o6'].map(id => document.getElementById(id).value).join('');
    }

    function startTimer(s) {
      clearInterval(timerInt);
      const el = document.getElementById('tmr');
      timerInt = setInterval(() => {
        el.textContent = `Resend in ${s}s`;
        if (--s < 0) {
          clearInterval(timerInt); el.textContent = '';
          document.getElementById('otp-btn').disabled = false;
        }
      }, 1000);
    }


    window.doSignUp = async function (e) {
      e.preventDefault();
      const name = document.getElementById('up-name').value.trim();
      const email = document.getElementById('up-email').value.trim();
      const phone = document.getElementById('up-phone').value.trim();
      const pwd = document.getElementById('up-pwd').value;
      if (phone.length !== 10) { msg('msg-up', 'err', '⚠️ Enter a valid 10-digit phone number.'); return; }
      setLoading('up-btn', true);
      try {
        // Create account with email/password
        const cred = await createUserWithEmailAndPassword(auth, email, pwd);
        // Save display name
        await updateProfile(cred.user, { displayName: name });
        // Save phone to localStorage (OTP verification coming in future)
        localStorage.setItem('gm_user', JSON.stringify({ name, email, phone: '+91' + phone }));
        window.location.href = 'progress.html';
      } catch (err) {
        setLoading('up-btn', false);
        document.getElementById('up-btn').innerHTML = '<i class="fas fa-user-plus" style="margin-right:7px"></i>Create Account';
        msg('msg-up', 'err', err.message || 'Sign up failed. Try again.');
      }
    };

    window.doSignIn = async function (e) {
      e.preventDefault();
      const email = document.getElementById('in-email').value;
      const pwd = document.getElementById('in-pwd').value;
      setLoading('in-btn', true);
      try {
        await signInWithEmailAndPassword(auth, email, pwd);
        window.location.href = 'progress.html';
      } catch (err) {
        setLoading('in-btn', false);
        document.getElementById('in-btn').innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:7px"></i>Sign In';
        const m = err.code === 'auth/invalid-credential' ? 'Invalid email or password.' : err.message;
        msg('msg-in', 'err', m);
      }
    };

    window.doGoogle = async function () {
      try {
        await signInWithPopup(auth, gProvider);
        window.location.href = 'progress.html';
      } catch (err) {
        msg('msg-in', 'err', err.message);
        msg('msg-up', 'err', err.message);
      }
    };
  </script>
</body>

</html>
